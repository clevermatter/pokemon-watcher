# ============================================================================
#  Jouw zoekopdrachten
# ============================================================================
#  Elke zoekopdracht begint met [[zoekopdracht]].
#  Kopieer een blok om er een toe te voegen, of zet actief = false om er
#  tijdelijk een uit te zetten. Regels die met # beginnen worden genegeerd.
#
#  Mogelijke instellingen ('zoekterm' of 'categorie' is verplicht):
#
#    naam             = "..."      naam in je berichten (moet uniek zijn)
#    zoekterm         = "..."      waar je op zoekt (weglaten = alles in de categorie)
#    max_prijs        = 30         maximale prijs in euro's
#    min_prijs        = 5          minimale prijs in euro's (filtert '1 euro'-lokkertjes)
#    alleen_met_prijs = true       advertenties met 'Bieden', 'N.o.t.k.' enz. overslaan
#    uitsluiten       = ["hoes"]   advertenties met deze woorden in de titel overslaan
#    alleen_in_titel  = true       zoekterm alleen in de titel zoeken (minder ruis)
#    categorie        = 356        hoofdcategorie (356 = Spelcomputers en Games)
#    subcategorie     = 2942       subcategorie (zie de tabel in README.md)
#    postcode         = "1234AB"   zoeken rond een postcode...
#    afstand_km       = 25         ...binnen zoveel kilometer
#    actief           = false      zoekopdracht tijdelijk uitzetten
# ============================================================================

# Hoe wil je de meldingen krijgen?
#   "overzicht" = elke check één bericht met alle nieuwe advertenties onder elkaar
#   "los"       = een apart bericht per advertentie, met foto
berichten = "overzicht"

# Geen automatische checks in deze periode (Nederlandse tijd). Leeg ("") = altijd checken.
nachtpauze = "02:00-06:00"


# Specifieke zoekopdrachten staan bovenaan: wat die melden, wordt in de
# bredere zoekopdrachten hieronder overgeslagen. Zo zie je in je bericht
# meteen of het om een ETB of booster box gaat.
[[zoekopdracht]]
naam = "Elite Trainer Box (Venray)"
zoekterm = "elite trainer box"
categorie = 1099         # Hobby en Vrije tijd
subcategorie = 930       # Verzamelkaartspellen | Pokémon
postcode = "5801MB"
afstand_km = 25


[[zoekopdracht]]
naam = "ETB (Venray)"
zoekterm = "etb"
categorie = 1099
subcategorie = 930
postcode = "5801MB"
afstand_km = 25


[[zoekopdracht]]
naam = "Booster box (Venray)"
zoekterm = "booster box"
categorie = 1099
subcategorie = 930
postcode = "5801MB"
afstand_km = 25


[[zoekopdracht]]
naam = "Pokémon-kaarten (Venray)"
categorie = 1099         # Hobby en Vrije tijd
subcategorie = 930       # Verzamelkaartspellen | Pokémon
postcode = "5801MB"      # Venray
afstand_km = 25


# Zoekt op "pokemon kaarten" in ALLE categorieën, voor advertenties die in een
# andere categorie staan (bv. Speelgoed of Verzamelen). Laat deze onderaan staan:
# wat de zoekopdracht hierboven al meldde, wordt hier overgeslagen.
[[zoekopdracht]]
naam = "Pokémon-kaarten overig (Venray)"
zoekterm = "pokemon kaarten"
postcode = "5801MB"
afstand_km = 25
uitsluiten = ["switch", "3ds", "nintendo ds", "game boy", "gameboy", "knuffel", "pluche"]
